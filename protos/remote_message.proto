// OpenRemote — reference schema of the Android TV Remote v2 wire protocol.
//
// This file documents the wire format implemented by atv_remote/wire.py
// (which hand-rolls the encoding; this .proto is kept as readable reference).
//
// Sources, cross-validated field-for-field (see EVIDENCE.md):
//  - APK evidence: Google Home 4.34.22.2 decompiled with REA/JADX — the app's
//    outbound envelope (defpackage.asup) is a single-oneof message with
//    message-typed members at 1, 2, 8, 9, 10, 11, 20, 21, 22, 30, 32, 50,
//    51, 60, 61, 70, 90 and a bytes member at 31; the inbound envelope
//    (defpackage.asvo) mirrors it with 40 = start/standby notification.
//  - Public protocol: remotemessage.proto (Apache-2.0,
//    github.com/tronikos/androidtvremote2, originally from
//    github.com/louis49/androidtv-remote).
//
// Framing on the TLS channel: every message is varint(byteLength) || bytes
// (protobuf "delimited" format; the app calls writeDelimitedTo /
// parseDelimitedFrom on the socket streams).

syntax = "proto3";

package remote;

// Android KeyEvent codes (AOSP keycodes.h). The app sends these values
// verbatim in remote_key_inject.key_code — evidence: volume keys arrive as
// 24/25, HOME as 3, BACK as 4, DPAD as 19-23 (REA ev_36c64e38, ev_8764d99a).
enum RemoteKeyCode {
  KEYCODE_UNKNOWN = 0;
  KEYCODE_HOME = 3;
  KEYCODE_BACK = 4;
  KEYCODE_0 = 7;
  KEYCODE_1 = 8;
  KEYCODE_2 = 9;
  KEYCODE_3 = 10;
  KEYCODE_4 = 11;
  KEYCODE_5 = 12;
  KEYCODE_6 = 13;
  KEYCODE_7 = 14;
  KEYCODE_8 = 15;
  KEYCODE_9 = 16;
  KEYCODE_DPAD_UP = 19;
  KEYCODE_DPAD_DOWN = 20;
  KEYCODE_DPAD_LEFT = 21;
  KEYCODE_DPAD_RIGHT = 22;
  KEYCODE_DPAD_CENTER = 23;
  KEYCODE_VOLUME_UP = 24;
  KEYCODE_VOLUME_DOWN = 25;
  KEYCODE_POWER = 26;
  KEYCODE_ENTER = 66;
  KEYCODE_DEL = 67;
  KEYCODE_MENU = 82;
  KEYCODE_SEARCH = 84;
  KEYCODE_MEDIA_PLAY_PAUSE = 85;
  KEYCODE_MEDIA_STOP = 86;
  KEYCODE_MEDIA_NEXT = 87;
  KEYCODE_MEDIA_PREVIOUS = 88;
  KEYCODE_MEDIA_REWIND = 89;
  KEYCODE_MEDIA_FAST_FORWARD = 90;
  KEYCODE_VOLUME_MUTE = 164;
  KEYCODE_INFO = 165;
  KEYCODE_CHANNEL_UP = 166;
  KEYCODE_CHANNEL_DOWN = 167;
  KEYCODE_GUIDE = 172;
  KEYCODE_SETTINGS = 176;
  KEYCODE_ASSIST = 231;
  // ... full AOSP keycode list applies
}

enum RemoteDirection {
  UNKNOWN_DIRECTION = 0;
  START_LONG = 1;
  END_LONG = 2;
  SHORT = 3;
}

// The envelope the client and TV exchange (APK class asup/asvo).
message RemoteMessage {
  RemoteConfigure remote_configure = 1;
  RemoteSetActive remote_set_active = 2;
  RemoteError remote_error = 3;
  RemotePingRequest remote_ping_request = 8;
  RemotePingResponse remote_ping_response = 9;
  RemoteKeyInject remote_key_inject = 10;          // APK: asvg "SendKeyCommand.Request"
  RemoteImeKeyInject remote_ime_key_inject = 20;
  RemoteImeBatchEdit remote_ime_batch_edit = 21;
  RemoteImeShowRequest remote_ime_show_request = 22;
  RemoteVoiceBegin remote_voice_begin = 30;
  RemoteVoicePayload remote_voice_payload = 31;    // APK: ONEOF_BYTES member
  RemoteVoiceEnd remote_voice_end = 32;
  RemoteStart remote_start = 40;                   // APK: asvk standby bool
  RemoteSetVolumeLevel remote_set_volume_level = 50;
  RemoteAdjustVolumeLevel remote_adjust_volume_level = 51;
  RemoteSetPreferredAudioDevice remote_set_preferred_audio_device = 60;
  RemoteResetPreferredAudioDevice remote_reset_preferred_audio_device = 61;
  // field 70: newer extension present in Google Home (APK class asur), not in
  // the public proto — treated as an unknown field by this client.
  RemoteAppLinkLaunchRequest remote_app_link_launch_request = 90;
}

// APK evidence (asrd.f): the TV sends code1 = capability mask (asub bits:
// INPUT=0x2, IME=0x4, VOICE=0x8, PTT_ASSISTANT=0x10, POWER=0x20, VOLUME=0x40,
// GAMEPAD=0x100, AUDIO_DEVICES=0x200, FIND_MY_REMOTE=0x400, APP_LINK=0x800)
// and device_info; the client replies with its own mask and device info
// (Build.MODEL / Build.MANUFACTURER in the app).
message RemoteConfigure {
  int32 code1 = 1;
  RemoteDeviceInfo device_info = 2;
}

message RemoteDeviceInfo {
  string model = 1;
  string vendor = 2;
  int32 unknown1 = 3;
  string unknown2 = 4;
  string package_name = 5;
  string app_version = 6;
}

message RemoteSetActive {
  int32 active = 1;
}

message RemoteKeyInject {
  RemoteKeyCode key_code = 1;
  RemoteDirection direction = 2;
}

message RemotePingRequest {
  int32 val1 = 1;
  int32 val2 = 2;
}

message RemotePingResponse {
  int32 val1 = 1;
}

message RemoteError {
  bool value = 1;
  RemoteMessage message = 2;
}

message RemoteStart {
  bool started = 1;
}

// ---- IME (text input) ----

message RemoteImeObject {
  int32 start = 1;
  int32 end = 2;
  string value = 3;
}

message RemoteEditInfo {
  int32 insert = 1;
  RemoteImeObject text_field_status = 2;
}

message RemoteImeBatchEdit {
  int32 ime_counter = 1;
  int32 field_counter = 2;
  repeated RemoteEditInfo edit_info = 3;
}

message RemoteAppInfo {
  int32 counter = 1;
  string label = 10;
  string app_package = 12;
}

message RemoteImeKeyInject {
  RemoteAppInfo app_info = 1;
  RemoteTextFieldStatus text_field_status = 2;
}

message RemoteTextFieldStatus {
  int32 counter_field = 1;
  string value = 2;
  int32 start = 3;
  int32 end = 4;
  int32 int5 = 5;
  string label = 6;
}

message RemoteImeShowRequest {
  RemoteTextFieldStatus remote_text_field_status = 2;
}

// ---- voice ----
// samples: 16-bit PCM, 8 kHz, mono (interoperable path). The Google Home app
// streams LC3-encoded audio on this same field (Lc3Encoder evidence); the
// payload is opaque bytes either way.

message RemoteVoiceBegin {
  int32 session_id = 1;
  string package_name = 2;
}

message RemoteVoicePayload {
  int32 session_id = 1;
  bytes samples = 2;
}

message RemoteVoiceEnd {
  int32 session_id = 1;
}

// ---- volume / audio devices ----

message RemoteSetVolumeLevel {
  uint32 unknown1 = 1;
  uint32 unknown2 = 2;
  string player_model = 3;
  uint32 unknown4 = 4;
  uint32 unknown5 = 5;
  uint32 volume_max = 6;
  uint32 volume_level = 7;
  bool volume_muted = 8;
}

message RemoteAdjustVolumeLevel {}
message RemoteSetPreferredAudioDevice {}
message RemoteResetPreferredAudioDevice {}

message RemoteAppLinkLaunchRequest {
  string app_link = 1;
}

// ---------------------------------------------------------------------------
// Pairing (POLO — AOSP external/google-tv-pairing-protocol). The Google Home
// app does NOT implement this (it uses an already-provisioned certificate,
// REA evidence: defpackage.asqa KeyStore); a standalone client pairs its own
// self-signed certificate with these messages on the same TLS channel.
// NOTE: this file is reference documentation, not compiled. The POLO section
// uses proto2 semantics (required/optional) as in AOSP polo.proto; the
// RemoteMessage section above is proto3.
// ---------------------------------------------------------------------------

message OuterMessage {
  enum Status {
    STATUS_OK = 200;
    STATUS_ERROR = 400;
    STATUS_BAD_CONFIGURATION = 401;
    STATUS_BAD_SECRET = 402;
  }
  required uint32 protocol_version = 1;  // the client sends 2
  required Status status = 2;
  optional PairingRequest pairing_request = 10;
  optional PairingRequestAck pairing_request_ack = 11;
  optional Options options = 20;
  optional Configuration configuration = 30;
  optional ConfigurationAck configuration_ack = 31;
  optional Secret secret = 40;
  optional SecretAck secret_ack = 41;
}

message PairingRequest {
  required string service_name = 1;  // "atvremote"
  optional string client_name = 2;
}

message PairingRequestAck {
  optional string server_name = 1;
}

message Options {
  enum EncodingType {
    ENCODING_TYPE_UNKNOWN = 0;
    ENCODING_TYPE_ALPHANUMERIC = 1;
    ENCODING_TYPE_NUMERIC = 2;
    ENCODING_TYPE_HEXADECIMAL = 3;
    ENCODING_TYPE_QRCODE = 4;
  }
  enum RoleType {
    ROLE_TYPE_UNKNOWN = 0;
    ROLE_TYPE_INPUT = 1;
    ROLE_TYPE_OUTPUT = 2;
  }
  message Encoding {
    required EncodingType type = 1;
    required uint32 symbol_length = 2;
  }
  repeated Encoding input_encodings = 1;
  repeated Encoding output_encodings = 2;
  optional RoleType preferred_role = 3;
}

message Configuration {
  required Options.Encoding encoding = 1;
  required Options.RoleType client_role = 2;
}

message ConfigurationAck {}

message Secret {
  // sha256(client_modulus || client_exponent || server_modulus ||
  //        server_exponent || pin[2:]); pin[0:2] must equal digest[0].
  required bytes secret = 1;
}

message SecretAck {
  required bytes secret = 1;
}
